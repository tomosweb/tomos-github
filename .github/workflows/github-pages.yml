name: Tomos GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Phase 5 merge baseline. Update deliberately to a compatible Tomos tag
  # when one is released.
  TOMOS_VERSION: 5b92b99114d719c083040b4af77f547da9987b32
  TOMOS_REPOSITORY: https://github.com/tomosweb/tomos.git
  OUTPUT_DIR: build/tomos-github-pages

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none

      - name: Fetch pinned Tomos Publishing Core
        shell: bash
        run: |
          set -euo pipefail
          tomos_root="$RUNNER_TEMP/tomos-core"
          git clone --depth 1 "$TOMOS_REPOSITORY" "$tomos_root"
          git -C "$tomos_root" fetch --depth 1 origin "$TOMOS_VERSION"
          git -C "$tomos_root" checkout --detach "$TOMOS_VERSION"
          test "$(git -C "$tomos_root" rev-parse HEAD)" = "$TOMOS_VERSION"
          echo "TOMOS_ROOT=$tomos_root" >> "$GITHUB_ENV"

      - name: Run Static Build contract
        shell: bash
        run: php "$TOMOS_ROOT/tests/static_site_builder_check.php"

      - name: Verify site-local theme static build
        shell: bash
        run: |
          set -euo pipefail
          custom_name="ci-custom-theme"
          mkdir -p "$GITHUB_WORKSPACE/themes" "$GITHUB_WORKSPACE/assets"
          cp "$TOMOS_ROOT/assets/tomos-static-search.js" "$GITHUB_WORKSPACE/assets/tomos-static-search.js"
          cp -R "$TOMOS_ROOT/themes/tomos-minimal" "$GITHUB_WORKSPACE/themes/$custom_name"
          php -r '
            $p = $argv[1];
            $theme = json_decode(file_get_contents($p), true);
            if (!is_array($theme)) { throw new RuntimeException("Invalid fixture theme"); }
            $theme["name"] = "ci-custom-theme";
            file_put_contents($p, json_encode($theme, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));
          ' "$GITHUB_WORKSPACE/themes/$custom_name/theme.json"
          php -r '
            $source = file_get_contents($argv[1]);
            $config = require $argv[1];
            $currentTheme = $config["theme"]["name"] ?? null;
            if (!is_string($currentTheme) || $currentTheme === "") { throw new RuntimeException("Missing theme name"); }
            $needle = "\x27name\x27 => " . var_export($currentTheme, true);
            $modified = str_replace($needle, "\x27name\x27 => \x27ci-custom-theme\x27", $source, $count);
            if ($count !== 1) { throw new RuntimeException("Fixture theme replacement failed"); }
            file_put_contents($argv[2], $modified);
          ' "$GITHUB_WORKSPACE/tomos.config.php" "$GITHUB_WORKSPACE/tomos.ci.config.php"
          php "$TOMOS_ROOT/tools/build-static-site.php" \
            --config="$GITHUB_WORKSPACE/tomos.ci.config.php" \
            --tomos-root="$TOMOS_ROOT" \
            --output="$RUNNER_TEMP/tomos-custom-theme-build"
          test -f "$RUNNER_TEMP/tomos-custom-theme-build/themes/$custom_name/assets/style.css"
          test -f "$RUNNER_TEMP/tomos-custom-theme-build/index.html"
          rm -f "$GITHUB_WORKSPACE/tomos.ci.config.php"
          rm -rf "$GITHUB_WORKSPACE/themes/$custom_name"

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/assets"
          cp "$TOMOS_ROOT/assets/tomos-static-search.js" "$GITHUB_WORKSPACE/assets/tomos-static-search.js"
          rm -rf "$OUTPUT_DIR"
          # Site-owned branding assets override theme defaults in the pinned Core.
          # Keep them inside the site repo; never write them to the Tomos service.
          if [ -d "$GITHUB_WORKSPACE/theme-assets" ]; then
            mkdir -p "$TOMOS_ROOT/theme-assets"
            for asset in "$GITHUB_WORKSPACE"/theme-assets/{ogp,favicon}.{png,jpg,webp}; do
              [ -f "$asset" ] || continue
              cp "$asset" "$TOMOS_ROOT/theme-assets/"
            done
          fi
          php "$TOMOS_ROOT/tools/build-static-site.php"             --config="$GITHUB_WORKSPACE/tomos.config.php"             --tomos-root="$TOMOS_ROOT"             --output="$OUTPUT_DIR"

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Verify Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f "$OUTPUT_DIR/index.html"
          test -f "$OUTPUT_DIR/404.html"
          test -f "$OUTPUT_DIR/search-index.json"
          test -f "$OUTPUT_DIR/feed.xml"
          test -f "$OUTPUT_DIR/sitemap.xml"
          test -f "$OUTPUT_DIR/robots.txt"
          test -f "$OUTPUT_DIR/assets/tomos-static-search.js"
          # Verify the configured theme instead of assuming tomos-minimal.
          selected_theme="$(php -r '$c = require $argv[1]; echo $c["theme"]["name"] ?? "";' "$GITHUB_WORKSPACE/tomos.config.php")"
          if [[ ! "$selected_theme" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*$ ]]; then
            echo "Invalid configured theme name" >&2
            exit 1
          fi
          test -f "$OUTPUT_DIR/themes/$selected_theme/assets/style.css"
          test -f "$OUTPUT_DIR/content/assets/example.txt"
          test -f "$OUTPUT_DIR/日本語記事/index.html"
          test -f "$OUTPUT_DIR/news/first-post/index.html"
          test ! -e "$OUTPUT_DIR/tomos.config.php"
          test ! -e "$OUTPUT_DIR/core"
          test ! -e "$OUTPUT_DIR/tools"
          test ! -e "$OUTPUT_DIR/tests"
          test ! -e "$OUTPUT_DIR/.github"
          test -z "$(find "$OUTPUT_DIR" -type f -name '*.md' -print -quit)"
          grep -F 'https://tomosweb.github.io/tomos-github/' "$OUTPUT_DIR/index.html"
          grep -F '/tomos-github/news/first-post' "$OUTPUT_DIR/news/first-post/index.html"
          ! grep -F 'Draft' "$OUTPUT_DIR/search-index.json"
          ! grep -F '/draft' "$OUTPUT_DIR/sitemap.xml"

      - name: Verify article OGP overrides site-wide OGP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TOMOS_ROOT/theme-assets"
          # Temporary fixture is only present inside this CI runner.
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+jawAAAABJRU5ErkJggg==' | base64 -d > "$TOMOS_ROOT/theme-assets/ogp.png"
          cat > "$GITHUB_WORKSPACE/content/news/ogp-override-ci.md" <<'EOF'
          ---
          title: OGP override CI
          date: 2026-10-22
          description: Test article-specific OGP priority.
          image: https://example.com/article-specific-ogp.png
          draft: false
          ---

          Test article OGP.
          EOF
          test_output="$RUNNER_TEMP/tomos-ogp-priority-test"
          php "$TOMOS_ROOT/tools/build-static-site.php" \
            --config="$GITHUB_WORKSPACE/tomos.config.php" \
            --tomos-root="$TOMOS_ROOT" \
            --output="$test_output"
          test -f "$test_output/theme-assets/ogp.png"
          grep -F 'property="og:image"' "$test_output/news/first-post/index.html" | grep -F '/theme-assets/ogp.png'
          grep -F 'property="og:image" content="https://example.com/article-specific-ogp.png"' "$test_output/news/ogp-override-ci/index.html"
          grep -F 'name="twitter:image" content="https://example.com/article-specific-ogp.png"' "$test_output/news/ogp-override-ci/index.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUTPUT_DIR }}

  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
